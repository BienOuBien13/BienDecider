name: Backlog Issues

on:
  push:
    branches: [main]
    paths:
      - docs/github-backlog.json
      - scripts/sync-backlog.cjs
      - .github/workflows/backlog.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backlog-issues
  cancel-in-progress: false

jobs:
  import:
    name: Import missing US
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Validate importer
        run: node --test scripts/sync-backlog.test.cjs
      - name: Create missing Issues without overwriting existing work
        uses: actions/github-script@v9
        with:
          script: |
            const { syncBacklogWithRetry, readCatalog } = require(`${process.env.GITHUB_WORKSPACE}/scripts/sync-backlog.cjs`);
            const result = await syncBacklogWithRetry({ github, context, catalog: readCatalog(), log: core.info });
            await core.summary.addHeading('Backlog Issues').addRaw(`Created ${result.created} US. Existing Issues preserved.`).write();